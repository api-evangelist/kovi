aid: kovi
name: Kovi
description: 'Kovi (Kovi Tecnologia S.A.) is a Brazilian mobility company founded in 2018 that rents and
  subscribes cars to ride-hailing and delivery app drivers across Latin America. It operates a fleet of
  new (0km) and certified pre-owned vehicles under monthly, annual and pay-per-kilometer plans that bundle
  maintenance, insurance-style protection and vehicle documentation, with a purchase option on its Kovi
  Proprio product. Kovi serves twelve Brazilian cities including Sao Paulo, Porto Alegre, Belo Horizonte,
  Florianopolis, Curitiba, Fortaleza, Goiania, Brasilia, Recife, Santos, Campinas and Salvador, plus a
  Mexican operation at kovi.mx, and employs more than 1,400 people. Driver onboarding and account
  self-service run through the Central do Motorista web app and an Android application, which are backed
  by a private, authentication-gated GraphQL API. Kovi publishes no public developer program, API
  documentation or SDKs as of this profile.'
