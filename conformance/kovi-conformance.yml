generated: '2026-07-19'
method: probed
source: >-
  live probes of api.kovi.us and motorista.kovi.com.br, plus static analysis of the
  Central do Motorista SPA JavaScript bundle
summary: >-
  Kovi operates a real production API but runs no public developer program. The
  Central do Motorista driver web app is a Vue/Quasar SPA that talks to a private
  GraphQL API. No OpenAPI, AsyncAPI, GraphQL SDL, SDK, sandbox, changelog, status
  page or developer documentation is published, and introspection is not available
  without credentials. Nothing below is inferred from marketing copy; each entry
  records what a probe actually returned.
api_surface:
- style: GraphQL
  endpoint: https://api.kovi.us/graphql
  secondary_endpoints:
  - https://api.kovi.us/graphql/driver-central
  public: false
  documented: false
  evidence:
  - source: https://motorista.kovi.com.br/js/app.df02b24b.js
    kind: client-bundle
    detail: >-
      SPA bundle ships apollo-cache, apollo-link-error, apollo-link-http-common,
      graphql and graphql-tag, and hardcodes the https://api.kovi.us/graphql and
      https://api.kovi.us/graphql/driver-central endpoints.
  - source: https://api.kovi.us/graphql
    kind: live-probe
    detail: >-
      POST of a minimal __schema introspection query returned HTTP 401 with body
      {"message":"Unauthorized"}. GET returns 403 at the edge. Introspection is
      therefore not reachable unauthenticated and no schema could be captured.
standards:
- id: graphql
  conforms: true
  evidence: >-
    live GraphQL endpoint at https://api.kovi.us/graphql; Apollo GraphQL client in
