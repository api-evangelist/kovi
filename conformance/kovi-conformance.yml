  evidence: >-
    no /.well-known/oauth-authorization-server on any reachable host; driver login
    is a phone-number plus 4-digit one-time-code flow per the published anti-fraud
    guidance at https://www.kovi.com.br/seguranca
- id: oidc
  conforms: false
  evidence: no valid /.well-known/openid-configuration (see well-known/kovi-well-known.yml)
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    unauthenticated error body is {"message":"..."}; not application/problem+json
- id: rfc9116-security-txt
  conforms: false
